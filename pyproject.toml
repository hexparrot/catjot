[project]
name = "catjot"
version = "0.0.1"
description = "cat-themed, cat-centric command-line note-taking"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# only the LLM endpoint (jot llm, chat, convo) needs it; reading and writing
# notes as a library imports nothing from the network side
llm = ["requests"]

[project.scripts]
jot = "catjot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["catjot", "catjot_mcp"]
